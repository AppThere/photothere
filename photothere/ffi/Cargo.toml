[package]
name = "loki-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C ABI over the PhotoCraft engine for the PhotoThere Kotlin Multiplatform front end"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
photocraft-automation = { path = "../../crates/automation" }
photocraft-engine = { path = "../../crates/engine" }
photocraft-compose = { path = "../../crates/compose" }
photocraft-raster = { path = "../../crates/raster" }
serde_json = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
